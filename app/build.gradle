plugins { id 'com.android.application' }
android {
    namespace 'app.blocker'
    compileSdk 35
    defaultConfig { applicationId 'app.blocker'; minSdk 26; targetSdk 35; versionCode 10; versionName '5.4.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        personal {
            storeFile rootProject.file('signing/personal-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.personal } }
    testOptions { unitTests.includeAndroidResources = true }
}

// Test-only dependencies. No additional APK runtime libraries.
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
tasks.withType(Test).configureEach {
 systemProperty 'robolectric.dependency.repo.url','https://repo.maven.apache.org/maven2'
 ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','http.nonProxyHosts'].each { n -> if(System.getProperty(n))systemProperty n,System.getProperty(n) }
}
